{% extends "base.html" %}

{% block title %}PlaceOrder{% endblock title %}

{% block body %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Place Your Order 🧸
                    </h2>

                    <div class="bg-light rounded-3 p-3 mb-4">
                        <h4>{{ product.name }}</h4>
                        <h5>Price: ₹{{ product.price }}</h5>
                    </div>

                    {% if error %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Your Name</label>
                            <input type="text"
                                   name="customer_name"
                                   class="form-control"
                                   maxlength="100"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="tel"
                                   name="phone"
                                   class="form-control"
                                   maxlength="15"
                                   pattern="[0-9]{10,15}"
                                   title="Enter 10 to 15 digits."
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Delivery Address</label>
                            <textarea name="address"
                                      class="form-control"
                                      rows="3"
                                      required></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Quantity</label>
                            <input type="number"
                                   name="quantity"
                                   class="form-control"
                                   min="1"
                                   max="100"
                                   value="1"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-dark btn-lg w-100">
                            Confirm Order 🛍️
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock body %}
